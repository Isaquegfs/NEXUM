<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUM</title>
<style>
:root{--bg:#f2f3f8;--papel:#fff;--tinta:#141a2b;--suave:#5d6783;--linha:#dde1ee;--acento:#4f5bd5;--c-tutorial:#3b6ff5;--c-erro-solucao:#e5532f;--c-ideia:#9a4df0;--c-anotacao:#0e9f8e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b101c;--papel:#121a2b;--tinta:#e8ecf8;--suave:#8c97b5;--linha:#223049;--acento:#8b95ff;--c-tutorial:#7ea2ff;--c-erro-solucao:#ff8a65;--c-ideia:#c299ff;--c-anotacao:#4fd8c4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.t-tutorial{--cor:var(--c-tutorial)}.t-erro-solucao{--cor:var(--c-erro-solucao)}.t-ideia{--cor:var(--c-ideia)}.t-anotacao{--cor:var(--c-anotacao)}
.barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,36px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--tinta);text-decoration:none;white-space:nowrap}
.barra input{flex:1;max-width:560px}
main{padding:22px clamp(14px,3vw,36px) 80px;max-width:1560px;margin:0 auto}
input,select,textarea{font:inherit;color:inherit;background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:8px 12px;width:100%}
textarea{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:65vh;resize:vertical}
.btn,button{font:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--papel);color:var(--tinta);border-radius:8px;padding:7px 14px;text-decoration:none;display:inline-block}
.btn.primario{background:var(--acento);border-color:var(--acento);color:var(--bg);font-weight:600}
.perigo{color:var(--c-erro-solucao)}
h1{margin:0 0 4px;font-size:1.7rem;line-height:1.2}
.vazio{color:var(--suave)}
.topo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.aviso{padding:10px 14px;border-radius:8px;background:var(--papel);border:1px solid var(--linha);margin:10px 0}
.erro{color:var(--c-erro-solucao)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--suave)}
.meta .tipo{color:var(--cor);font-weight:700}
/* lista */
.filtros{display:grid;gap:8px;margin-bottom:18px}.filtros div{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 12px;border-radius:99px;font-size:.87rem}.chip.on{background:var(--acento);border-color:var(--acento);color:var(--bg)}.chip small{opacity:.7}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{display:block;background:var(--papel);border:1px solid var(--linha);border-left:5px solid var(--cor,var(--linha));border-radius:10px;padding:12px 16px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--acento);border-left-color:var(--cor)}
.card p{margin:4px 0 8px;color:var(--suave);font-size:.93rem}
mark{background:color-mix(in srgb,var(--acento) 25%,transparent);color:inherit}
/* início */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{padding:12px 16px;background:var(--papel);border:1px solid var(--linha);border-radius:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{color:var(--suave);font-size:.85rem}
.captura{display:flex;gap:8px;margin:0 0 16px;padding:8px;background:var(--papel);border:1px solid var(--linha);border-radius:12px}
.captura input{border:0;background:transparent}
.mapa-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.mapa-wrap.foco{grid-template-columns:minmax(0,1fr) 330px}
.tela{border-radius:16px;overflow:hidden;border:1px solid #1c2a44;background:radial-gradient(circle at 50% 50%,#15213b 0,#0a1020 72%)}
.mapa{display:block;width:100%;height:auto;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.lig{fill:none;opacity:.35;transition:opacity .3s}.lig.cruz{stroke-dasharray:5 5;opacity:.3}.lig.on{opacity:.95}.lig.core{stroke-width:1.6}
.tema{cursor:pointer;outline:none;transition:opacity .3s}
.tem-foco .tema:not(.on){opacity:.28}.tem-foco .lig:not(.on){opacity:.08}
.halo{opacity:.22;filter:url(#gl)}.no{fill:#0f182b;stroke-width:2.5}.tema:hover .no,.tema:focus-visible .no{stroke-width:5}
.num{font:700 13px system-ui,sans-serif;fill:#e6ecff;pointer-events:none}
.rotulo{font:600 16px system-ui,sans-serif;fill:#e6ecff;paint-order:stroke;stroke:#0a1020;stroke-width:4px;pointer-events:none}
.hasta{stroke-width:1;opacity:.5}.np{stroke:#0a1020;stroke-width:1.5}.np:hover{r:8}
.nlab{font:11px system-ui,sans-serif;fill:#cfd8f0;paint-order:stroke;stroke:#0a1020;stroke-width:3px;opacity:0;transition:opacity .25s}
.tema.on .nlab,.tema:hover .nlab{opacity:1}
.core{cursor:pointer;outline:none}.core text{fill:#e6ecff;text-anchor:middle;font:600 12px system-ui,sans-serif;pointer-events:none}.core .cn{font-weight:400;fill:#9fb0d4;font-size:11px}
.pulso{fill:none;stroke:#7c9cff;transform-box:fill-box;transform-origin:center;animation:pulso 3.4s ease-out infinite}
@keyframes pulso{from{transform:scale(1);opacity:.5}to{transform:scale(1.6);opacity:0}}
.painel{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px;display:none;max-height:640px;overflow:auto}
.foco .painel{display:block}
.p-topo{display:flex;align-items:center;gap:10px;margin-bottom:12px}.p-topo h3{margin:0}.p-topo .x{margin-left:auto;padding:0 10px;font-size:1.2rem}
.pt{width:14px;height:14px;border-radius:50%}
.mini{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--tinta);text-decoration:none}.mini:hover{background:var(--bg)}.mini i{width:9px;height:9px;border-radius:50%;flex:none}
.painel h4{margin:16px 0 6px;font-size:.85rem;color:var(--suave)}
.p-liga button{display:block;width:100%;text-align:left;margin-bottom:6px}.p-liga small{color:var(--suave);display:block}
.painel .btn{margin-top:14px;width:100%;text-align:center}
.legenda{margin:10px 0 0}.legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.insight{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0 22px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--acento) 10%,var(--papel));border:1px solid color-mix(in srgb,var(--acento) 35%,var(--linha))}
.sec{margin:18px 0 8px;font-size:1rem;color:var(--suave)}
.ramos{display:none}
/* nota */
.capa{padding:22px clamp(16px,3vw,32px);border:1px solid var(--linha);border-radius:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--cor) 16%,var(--papel)),var(--papel) 65%);margin-bottom:24px}
.capa h1{font-size:clamp(1.7rem,3vw,2.5rem);line-height:1.15;margin:12px 0}
.trilha{display:flex;gap:8px;font-size:.85rem;color:var(--suave)}.trilha a{color:inherit}
.capa-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.selo{padding:3px 14px;border-radius:99px;background:var(--cor);color:var(--papel);font-weight:700;font-size:.82rem}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{padding:3px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.tags a{font-size:.85rem;color:var(--suave);text-decoration:none}
.hist{margin:0 0 20px;padding:0;list-style:none;font-size:.9rem;color:var(--suave)}
.corpo{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:32px;align-items:start}
.rail{position:sticky;top:76px}.rail h4{margin:0 0 8px;font-size:.85rem;color:var(--suave)}
.rail [data-ir]{display:block;padding:5px 10px;border-left:2px solid var(--linha);color:var(--suave);text-decoration:none;font-size:.9rem}
.rail [data-ir].ativo{border-left-color:var(--cor);color:var(--tinta);font-weight:600}
.ficha{margin-top:20px;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--papel);font-size:.88rem;color:var(--suave)}
article{font-size:1.03rem;line-height:1.72;min-width:0}
article p{margin:.7em 0}
article h2{margin:2em 0 .6em;padding-left:14px;border-left:5px solid var(--cor,var(--acento));font-size:1.5rem;line-height:1.25;scroll-margin-top:84px}
article h3{margin:1.6em 0 .4em;font-size:1.12rem;scroll-margin-top:84px}
article img{max-width:100%;height:auto;border:1px solid var(--linha);border-radius:8px}
article table{border-collapse:collapse;display:block;overflow-x:auto}article td,article th{border:1px solid var(--linha);padding:6px 10px}
article :not(pre)>code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--tinta) 9%,var(--papel));border:1px solid var(--linha);padding:1px 6px;border-radius:6px}
article ol{list-style:none;counter-reset:p;padding:0;margin:1em 0}
article ol>li{counter-increment:p;position:relative;margin:14px 0;padding:14px 18px 14px 68px;background:var(--papel);border:1px solid var(--linha);border-radius:12px}
article ol>li::before{content:counter(p);position:absolute;left:16px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--cor,var(--acento));color:var(--papel);font:700 1rem system-ui,sans-serif;display:grid;place-items:center}
article ol>li>:first-child{margin-top:0}article ol>li>:last-child{margin-bottom:0}
article blockquote{margin:1.2em 0;padding:8px 16px;border-left:4px solid var(--c-anotacao);background:var(--papel);border-radius:0 8px 8px 0}
article blockquote.aviso{border-left-color:var(--c-erro-solucao)}article blockquote p{margin:.4em 0}
.codigo{position:relative;margin:1.2em 0;border-radius:12px;background:#15181f;border:1px solid #2a303c}
.codigo pre{margin:0;padding:14px 76px 14px 18px;overflow-x:auto;color:#e6e9f0;font:.92rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.codigo code{background:none;padding:0;border:0;font:inherit}
.ln{display:block;white-space:pre}.ln:empty{min-height:1.6em}
.prompt .ln:not(:empty)::before{content:attr(data-p) " ";color:#6b7384;user-select:none;margin-right:.4ch}
.codigo .copiar{position:absolute;top:8px;right:8px;padding:2px 10px;font-size:.78rem;background:#1e232d;color:#aab3c5;border-color:#2f3644;opacity:0;transition:opacity .15s}
.codigo:hover .copiar,.codigo .copiar:focus-visible{opacity:1}
@media(hover:none){.codigo .copiar{opacity:1}}
/* editor */
.linha{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:10px 0}
.campo label,.linha label{font-size:.85rem;color:var(--suave);display:block;margin-bottom:2px}
.sug{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px}.sug button{padding:1px 9px;font-size:.82rem}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}.abas .on{border-color:var(--acento);font-weight:600}
.duo{display:grid;gap:16px}.duo #pv{max-height:75vh;overflow:auto;padding:4px 18px 18px;border:1px solid var(--linha);border-radius:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 18px;border-radius:99px;background:var(--tinta);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
@media(min-width:1100px){.duo{grid-template-columns:1fr 1fr}.so-estreito{display:none}}
@media(max-width:1099px){.duo #pv{display:none}.duo.prev #pv{display:block}.duo.prev textarea{display:none}}
@media(max-width:1000px){.corpo{grid-template-columns:1fr}.rail{position:static;order:-1}}
@media(max-width:760px){.tela,.painel{display:none!important}.mapa-wrap.foco{grid-template-columns:1fr}.ramos{display:grid;gap:10px;margin-bottom:20px}.linha{grid-template-columns:1fr}.barra{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.pulso{animation:none}.lig,.tema,.nlab,#toast{transition:none}}
</style>
</head>
<body>
<header class="barra">
  <a class="marca" href="#/"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 13 5 6M13 13l9-4M13 13l-3 9" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="13" cy="13" r="4" fill="var(--acento)"/><circle cx="5" cy="6" r="2.6" fill="var(--c-tutorial)"/><circle cx="22" cy="9" r="2.6" fill="var(--c-ideia)"/><circle cx="10" cy="22" r="2.6" fill="var(--c-anotacao)"/></svg><span>NEXUM</span></a>
  <input id="q" type="search" placeholder="Buscar em tudo   ( / )" aria-label="Buscar">
  <a class="btn primario" href="#/nova">Nova nota</a>
</header>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||'Erro '+r.status);return j};
const post=(u,m,b)=>api(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const NOMES={tutorial:'Tutorial','erro-solucao':'Erro e solução',ideia:'Ideia',anotacao:'Anotação'};
const COR={tutorial:'#5b8cff','erro-solucao':'#ff7a4d',ideia:'#b57bff',anotacao:'#2dd4bf'};
const PAL=['#7c9cff','#5eead4','#fbbf24','#f472b6','#a78bfa','#fb923c','#34d399','#60a5fa'];
let meta={tipos:[],modelos:{},temas:[],tags:[]},filtro={q:'',tema:'',tipo:'',tag:''},rascunho=null;
const reduz=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
const copiar=t=>navigator.clipboard?.writeText(t).catch(()=>fallback(t))||fallback(t);

document.addEventListener('click',async e=>{const b=e.target.closest('.copiar');if(!b)return;await copiar(b.closest('.codigo').dataset.raw);b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar',1500)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches?.('.tema,#core'))e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){e.preventDefault();$('#q').focus()}
});
$('#q').oninput=e=>{clearTimeout($('#q').t);$('#q').t=setTimeout(()=>{filtro.q=e.target.value;if(location.hash!=='#/notas')location.hash='#/notas';else rota()},180)};
$('main').onclick=e=>{
  const f=e.target.closest('.f');if(f){const{k,v}=f.dataset;filtro[k]=filtro[k]===v?'':v;rota();return}
  if(e.target.closest('[data-limpar]')){filtro={q:'',tema:'',tipo:'',tag:''};$('#q').value='';rota();return}
  const ir=e.target.closest('[data-ir]');if(ir){e.preventDefault();document.getElementById(ir.dataset.ir)?.scrollIntoView({behavior:reduz()?'auto':'smooth'});return}
  const ar=e.target.closest('[data-area]');if(ar){filtro={q:'',tema:ar.dataset.area,tipo:'',tag:''};return}
  const tg=e.target.closest('[data-tagf]');if(tg)filtro={q:'',tema:'',tipo:'',tag:tg.dataset.tagf};
};

/* ---------- lista ---------- */
const card=n=>`<a class="card t-${n.tipo}" href="#/nota/${n.id}"><strong>${esc(n.titulo)}</strong><p>${n.trecho||esc(n.resumo)}</p><div class="meta"><span class="tipo">${NOMES[n.tipo]}</span><span>${esc(n.tema)}</span>${n.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}<span>${esc(n.atualizado)}</span></div></a>`;
function chips(){
  const b=(k,v,q)=>`<button class="chip f ${filtro[k]===v?'on':''}" data-k="${k}" data-v="${esc(v)}">${esc(NOMES[v]||v)}${q?` <small>${q}</small>`:''}</button>`;
  return `<div class="filtros"><div>${meta.temas.map(t=>b('tema',t.nome,t.qtd)).join('')}</div><div>${meta.tipos.map(t=>b('tipo',t)).join('')}</div><div>${meta.tags.slice(0,20).map(t=>b('tag',t.nome,t.qtd)).join('')}</div></div>`;
}
async function lista(){
  const notas=await api('/api/notas?'+new URLSearchParams(Object.entries(filtro).filter(([,v])=>v)));
  $('#q').value=filtro.q;
  $('main').innerHTML=`<div class="topo"><h1>${filtro.q?`Resultados para “${esc(filtro.q)}”`:'Todas as notas'}</h1><span class="vazio">${notas.length}</span>${Object.values(filtro).some(Boolean)?'<button class="chip" data-limpar>Limpar filtros</button>':''}</div>${chips()}`+
    (notas.length?`<div class="grade">${notas.map(card).join('')}</div>`:`<div class="aviso">Nada encontrado. <a href="#/nova">Nova nota</a></div>`);
}

/* ---------- início: mapa de conexões ---------- */
function animarVB(svg,alvo){
  const de=svg._vb||[0,0,1000,640];svg._vb=alvo;cancelAnimationFrame(svg._raf);
  if(reduz()){svg.setAttribute('viewBox',alvo.join(' '));return}
  const t0=performance.now(),passo=t=>{const k=Math.min(1,(t-t0)/500),e=1-Math.pow(1-k,3);svg.setAttribute('viewBox',de.map((v,i)=>v+(alvo[i]-v)*e).join(' '));if(k<1)svg._raf=requestAnimationFrame(passo)};
  svg._raf=requestAnimationFrame(passo);
}
async function inicio(){
  const notas=await api('/api/notas'),hoje=Date.now();
  const T=meta.temas.map((t,i)=>({...t,cor:PAL[i%PAL.length],notas:notas.filter(x=>x.tema===t.nome)}));
  T.forEach(t=>t.tags=new Set(t.notas.flatMap(x=>x.tags)));
  const pares=[];
  for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){const c=[...T[i].tags].filter(x=>T[j].tags.has(x));if(c.length)pares.push({a:i,b:j,tags:c})}
  let conex=0;for(let i=0;i<notas.length;i++)for(let j=i+1;j<notas.length;j++)if(notas[i].tags.some(x=>notas[j].tags.includes(x)))conex++;
  const revisar=notas.filter(x=>x.atualizado&&hoje-new Date(x.atualizado)>90*864e5).length,semTags=notas.filter(x=>!x.tags.length).length;
  const topo=[...pares].sort((x,y)=>y.tags.length-x.tags.length)[0];
  const stat=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const cab=`<div class="topo"><h1>Seu conhecimento</h1></div>
  <div class="captura"><input id="cap" placeholder="Anote algo rápido e aperte Enter. Vai para a caixa de entrada." aria-label="Anotação rápida"><button id="capbtn" class="btn primario">Guardar</button></div>
  <div class="stats">${stat(notas.length,'notas')}${stat(T.length,'áreas')}${stat(conex,'conexões entre notas')}${stat(meta.tags.length,'tags')}${stat(revisar,'para revisar (90+ dias)')}</div>`;
  const ligarCap=()=>{const c=$('#cap');const salvar=async()=>{const v=c.value.trim();if(!v)return;try{await post('/api/notas','PUT',{titulo:v.split('\n')[0].slice(0,60),tema:'caixa-de-entrada',tipo:'anotacao',tags:'',corpo:v});toast('Guardado em caixa-de-entrada');rota()}catch(x){toast(x.message)}};c.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();salvar()}};$('#capbtn').onclick=salvar};
  if(!T.length){$('main').innerHTML=cab+`<div class="aviso">Nada no mapa ainda. Guarde uma anotação acima, <a href="#/nova">crie uma nota</a> ou importe um docx.</div>`;ligarCap();return}

  const W=1000,Hh=640,cx=500,cy=320,n=T.length,anim=!reduz();
  T.forEach((t,i)=>{const a=-Math.PI/2+2*Math.PI*i/n+(n>1?Math.PI/n:0);t.x=cx+330*Math.cos(a);t.y=cy+212*Math.sin(a);t.r=17+Math.min(t.qtd,10)*1.6;t.ang=Math.atan2(t.y-cy,t.x-cx)});
  const f0=v=>v.toFixed(0);
  const ligCore=T.map((t,i)=>{const mx=(cx+t.x)/2,my=(cy+t.y)/2,dx=t.y-cy,dy=-(t.x-cx),L=Math.hypot(dx,dy)||1,d=`M${cx},${cy} Q${f0(mx+dx/L*22)},${f0(my+dy/L*22)} ${f0(t.x)},${f0(t.y)}`;
    return `<path class="lig core" data-a="${i}" d="${d}" stroke="${t.cor}"/>`+(anim?`<circle r="2.6" fill="${t.cor}"><animateMotion dur="${5+i%3}s" begin="${(i*.7).toFixed(1)}s" repeatCount="indefinite" path="${d}"/></circle>`:'')}).join('');
  const ligCruz=pares.map(p=>{const A=T[p.a],B=T[p.b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
    return `<path class="lig cruz" data-a="${p.a}" data-b="${p.b}" d="M${f0(A.x)},${f0(A.y)} Q${f0(mx+(mx-cx)*.35)},${f0(my+(my-cy)*.35)} ${f0(B.x)},${f0(B.y)}" stroke="#9fb0d4" stroke-width="${1+Math.min(p.tags.length,5)*.8}"><title>${esc(p.tags.map(x=>'#'+x).join(' '))}</title></path>`}).join('');
  const grupos=T.map((t,i)=>{
    const m=Math.min(t.notas.length,9),Rn=t.r+36+(m>6?12:0);
    const nos=t.notas.slice(0,m).map((x,k)=>{const a=t.ang+(k-(m-1)/2)*.5,c=Math.cos(a),px=t.x+Rn*c,py=t.y+Rn*Math.sin(a),lx=t.x+(Rn+12)*c,ly=t.y+(Rn+12)*Math.sin(a);
      return `<a class="folha-link" href="#/nota/${x.id}"><line class="hasta" x1="${f0(t.x)}" y1="${f0(t.y)}" x2="${f0(px)}" y2="${f0(py)}" stroke="${t.cor}"/><circle class="np" cx="${f0(px)}" cy="${f0(py)}" r="5.5" fill="${COR[x.tipo]}"><title>${esc(x.titulo)}</title></circle><text class="nlab" x="${f0(lx)}" y="${f0(ly+4)}" text-anchor="${c>.25?'start':c<-.25?'end':'middle'}">${esc(x.titulo.length>28?x.titulo.slice(0,27)+'…':x.titulo)}</text></a>`}).join('');
    return `<g class="tema" data-i="${i}" tabindex="0" role="button" aria-label="${esc(t.nome)}, ${t.qtd} notas">${nos}<circle class="halo" cx="${f0(t.x)}" cy="${f0(t.y)}" r="${f0(t.r+8)}" fill="${t.cor}"/><circle class="no" cx="${f0(t.x)}" cy="${f0(t.y)}" r="${f0(t.r)}" stroke="${t.cor}"/><text class="num" x="${f0(t.x)}" y="${f0(t.y+4)}" text-anchor="middle">${t.qtd}</text><text class="rotulo" x="${f0(t.x)}" y="${f0(t.y<=cy?t.y+t.r+17:t.y-t.r-9)}" text-anchor="middle">${esc(t.nome)}</text></g>`}).join('');
  const svg=`<svg class="mapa" viewBox="0 0 ${W} ${Hh}" role="group" aria-label="Mapa de conexões do conhecimento"><defs><filter id="gl"><feGaussianBlur stdDeviation="8"/></filter><radialGradient id="nucleo"><stop offset="0" stop-color="#2b3f78"/><stop offset="1" stop-color="#16213f"/></radialGradient></defs>${ligCruz}${ligCore}${grupos}
  <g class="core" id="core" tabindex="0" role="button" aria-label="Ver o mapa inteiro"><circle class="pulso" cx="${cx}" cy="${cy}" r="46"/><circle cx="${cx}" cy="${cy}" r="44" fill="url(#nucleo)" stroke="#7c9cff" stroke-width="2"/><text x="${cx}" y="${cy-8}">Meu</text><text x="${cx}" y="${cy+6}">conhecimento</text><text class="cn" x="${cx}" y="${cy+22}">${notas.length} notas</text></g></svg>`;
  const insight=topo?`As áreas <b>${esc(T[topo.a].nome)}</b> e <b>${esc(T[topo.b].nome)}</b> compartilham ${topo.tags.length} tag${topo.tags.length>1?'s':''} (${topo.tags.slice(0,4).map(x=>'#'+esc(x)).join(', ')}). Que tal uma nota ligando as duas?`
    :semTags?`${semTags} nota${semTags>1?'s estão':' está'} sem tags. Com tags, o mapa passa a ligar uma área à outra.`:'Use as mesmas tags em áreas diferentes: é assim que o mapa mostra as conexões.';
  const painel=i=>{const t=T[i],liga=pares.filter(p=>p.a===i||p.b===i).map(p=>({j:p.a===i?p.b:p.a,tags:p.tags}));
    return `<div class="p-topo"><span class="pt" style="background:${t.cor}"></span><div><h3>${esc(t.nome)}</h3><span class="vazio">${t.qtd} notas</span></div><button class="x" data-fechar aria-label="Fechar">×</button></div>
    ${t.notas.map(x=>`<a href="#/nota/${x.id}" class="mini"><i style="background:${COR[x.tipo]}"></i><span>${esc(x.titulo)}</span></a>`).join('')}
    ${liga.length?`<h4>Conecta com</h4><div class="p-liga">${liga.map(l=>`<button data-foco="${l.j}"><b style="color:${T[l.j].cor}">●</b> ${esc(T[l.j].nome)}<small>${l.tags.map(x=>'#'+esc(x)).join(' ')}</small></button>`).join('')}</div>`:''}
    <a class="btn primario" href="#/notas" data-area="${esc(t.nome)}">Abrir área</a>`};
  $('main').innerHTML=cab+`<div class="mapa-wrap"><div class="tela">${svg}</div><aside class="painel"></aside></div>
  <div class="ramos">${T.map(t=>`<a class="card" href="#/notas" data-area="${esc(t.nome)}"><strong>${esc(t.nome)}</strong><div class="meta"><span>${t.qtd} notas</span>${pares.filter(p=>T[p.a]===t||T[p.b]===t).map(p=>`<span>↔ ${esc(T[p.a]===t?T[p.b].nome:T[p.a].nome)}</span>`).join('')}</div></a>`).join('')}</div>
  <div class="meta legenda">${meta.tipos.map(t=>`<span><i style="background:${COR[t]}"></i>${NOMES[t]}</span>`).join('')}</div>
  <div class="insight"><span>${insight}</span>${topo?'<button class="btn primario" id="lig">Criar nota ligando</button>':''}</div>
  <h3 class="sec">Recentes</h3><div class="grade">${notas.slice(0,6).map(card).join('')}</div>`;
  ligarCap();
  const wrap=$('.mapa-wrap'),sv=$('.mapa'),pn=$('.painel');let foco=-1;
  const realcar=i=>sv.querySelectorAll('.lig').forEach(l=>l.classList.toggle('on',i>=0&&(+l.dataset.a===i||(l.dataset.b!==undefined&&+l.dataset.b===i))));
  const aplicar=()=>{wrap.classList.toggle('foco',foco>=0);sv.classList.toggle('tem-foco',foco>=0);sv.querySelectorAll('.tema').forEach(g=>g.classList.toggle('on',+g.dataset.i===foco));realcar(foco);pn.innerHTML=foco>=0?painel(foco):'';
    animarVB(sv,foco>=0?[Math.max(0,Math.min(W-560,T[foco].x-280)),Math.max(0,Math.min(Hh-350,T[foco].y-175)),560,350]:[0,0,W,Hh])};
  wrap.onclick=e=>{
    if(e.target.closest('.folha-link'))return;
    const g=e.target.closest('.tema');if(g){foco=foco===+g.dataset.i?-1:+g.dataset.i;aplicar();return}
    const f=e.target.closest('[data-foco]');if(f){foco=+f.dataset.foco;aplicar();return}
    if(e.target.closest('[data-fechar]')||e.target.closest('#core')||e.target===sv||e.target.classList.contains('tela')){foco=-1;aplicar()}
  };
  sv.onmouseover=e=>{const g=e.target.closest('.tema');if(foco<0&&g)realcar(+g.dataset.i)};
  sv.onmouseout=()=>{if(foco<0)realcar(-1)};
  if($('#lig'))$('#lig').onclick=()=>{rascunho={titulo:`${T[topo.a].nome} + ${T[topo.b].nome}`,tema:'',tipo:'ideia',tags:topo.tags.slice(0,6)};location.hash='#/nova'};
}

/* ---------- nota ---------- */
async function ver(tema,slug){
  const n=await api(`/api/notas/${tema}/${slug}`),s=n.stats;
  const bd=(v,a,b)=>v?`<span class="badge"><b>${v}</b> ${v===1?a:b}</span>`:'';
  const toc=n.toc.length>=2?`<h4>Nesta nota</h4>${n.toc.map(t=>`<a href="#/nota/${n.id}" data-ir="${esc(t.id)}">${esc(t.texto)}</a>`).join('')}`:'';
  $('main').innerHTML=`<div class="leitor t-${n.tipo}"><header class="capa">
    <div class="trilha"><a href="#/">Início</a><span>/</span><a href="#/notas" data-area="${esc(n.tema)}">${esc(n.tema)}</a></div>
    <div class="capa-topo"><span class="selo">${NOMES[n.tipo]}</span><div class="acoes"><a class="btn" href="#/editar/${n.id}">Editar</a><button id="hist">Histórico</button><button id="del" class="perigo">Excluir</button></div></div>
    <h1>${esc(n.titulo)}</h1>
    <div class="badges">${bd(s.passos,'passo','passos')}${bd(s.blocos,'bloco de código','blocos de código')}<span class="badge"><b>${s.minutos}</b> min de leitura</span></div>
    <div class="tags">${n.tags.map(t=>`<a href="#/notas" data-tagf="${esc(t)}">#${esc(t)}</a>`).join('')}</div></header>
    <ul id="lh" class="hist" hidden></ul>
    <div class="corpo"><article>${n.html}</article><aside class="rail">${toc}<div class="ficha">Criada em ${esc(n.criado)}<br>Atualizada em ${esc(n.atualizado)}</div></aside></div></div>`;
  $('#hist').onclick=async()=>{const h=await api(`/api/historico/${n.id}`),u=$('#lh');u.hidden=!u.hidden;u.innerHTML=h.length?h.map(c=>`<li>${esc(c.data)} ${esc(c.msg)} (${c.hash})</li>`).join(''):'<li>Sem histórico ainda.</li>'};
  $('#del').onclick=async()=>{if(confirm(`Excluir "${n.titulo}"? O histórico continua no Git.`)){await api(`/api/notas/${n.id}`,{method:'DELETE'});location.hash='#/'}};
  const ls=[...document.querySelectorAll('.rail [data-ir]')];
  if(ls.length&&'IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)ls.forEach(l=>l.classList.toggle('ativo',l.dataset.ir===en.target.id))}),{rootMargin:'-80px 0px -70% 0px'});ls.forEach(l=>{const h=document.getElementById(l.dataset.ir);if(h)io.observe(h)})}
}

/* ---------- editor ---------- */
function editor(n){
  const rd=rascunho;rascunho=null;const novo=!n,tp=rd?.tipo||'tutorial';
  n=n||{titulo:rd?.titulo||'',tema:rd?.tema??filtro.tema,tipo:tp,tags:rd?.tags||[],corpo:meta.modelos[tp]};
  let modelo=novo?meta.modelos[n.tipo]:null;
  $('main').innerHTML=`<div class="topo"><h1>${novo?'Nova nota':'Editar nota'}</h1><div class="acoes"><button id="sv" class="btn primario">Salvar</button><a class="btn" href="#/${novo?'':'nota/'+n.id}">Cancelar</a></div></div><div id="msg"></div>
  <div class="campo"><label for="ft">Título</label><input id="ft" value="${esc(n.titulo)}"></div>
  <div class="linha"><div><label for="fm">Tema (pasta)</label><input id="fm" list="temas" value="${esc(n.tema)}" placeholder="redes, linux, virtualizacao"><datalist id="temas">${meta.temas.map(t=>`<option value="${esc(t.nome)}">`).join('')}</datalist></div>
  <div><label for="fp">Tipo</label><select id="fp">${meta.tipos.map(t=>`<option value="${t}" ${t===n.tipo?'selected':''}>${NOMES[t]}</option>`).join('')}</select></div>
  <div><label for="fg">Tags (separe por vírgula)</label><input id="fg" value="${esc(n.tags.join(', '))}"></div></div>
  <div class="sug">${meta.tags.slice(0,16).map(t=>`<button type="button" data-t="${esc(t.nome)}">#${esc(t.nome)}</button>`).join('')}</div>
  <div class="abas"><button id="ae" class="on so-estreito">Escrever</button><button id="av" class="so-estreito">Prévia</button><button id="an" title="Detecta códigos (linhas com #), ajusta títulos e remove sobras do Word">Arrumar formatação</button>${novo?'<label class="btn">Importar docx<input id="fu" type="file" accept=".docx,.md,.txt" hidden></label>':''}</div>
  <p class="vazio" style="margin:0 0 8px;font-size:.85rem">Escreva <code>// Título</code> para títulos (<code>///</code> subtítulo) e <code>#</code> no começo da linha para código. Linhas seguidas com <code>#</code> formam uma caixa.</p><div class="duo"><textarea id="fc" aria-label="Conteúdo em Markdown">${esc(n.notacao??n.corpo)}</textarea><article id="pv" class="t-${n.tipo}"></article></div>`;
  const msg=(t,c='erro')=>$('#msg').innerHTML=t?`<p class="aviso ${c}">${esc(t)}</p>`:'';
  const prev=async()=>{try{$('#pv').innerHTML=(await post('/api/preview','POST',{corpo:$('#fc').value})).html}catch{}};
  let pt;$('#fc').oninput=()=>{clearTimeout(pt);pt=setTimeout(prev,300)};prev();
  $('.sug').onclick=e=>{const t=e.target.dataset.t;if(!t)return;const i=$('#fg'),l=i.value.split(',').map(s=>s.trim()).filter(Boolean);if(!l.includes(t))l.push(t);i.value=l.join(', ')};
  $('#fp').onchange=e=>{const c=$('#fc');if(c.value.trim()===(modelo||'').trim()){modelo=meta.modelos[e.target.value];c.value=modelo;prev()}};
  $('#ae').onclick=()=>{$('.duo').classList.remove('prev');$('#ae').classList.add('on');$('#av').classList.remove('on')};
  $('#av').onclick=()=>{prev();$('.duo').classList.add('prev');$('#av').classList.add('on');$('#ae').classList.remove('on')};
  $('#an').onclick=async()=>{try{$('#fc').value=(await post('/api/normalizar','POST',{corpo:$('#fc').value})).corpo;prev();msg('Formatação ajustada. Confira na prévia.','')}catch(x){msg(x.message)}};
  if($('#fu'))$('#fu').onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('arquivo',f);
    try{const r=await api('/api/upload',{method:'POST',body:fd});if(!$('#ft').value)$('#ft').value=r.titulo;$('#fc').value=r.corpo;modelo=null;prev();msg('Importado. Revise o texto, escolha tema, tipo e tags e salve.','')}catch(x){msg(x.message)}};
  const salvar=async()=>{try{const r=await post('/api/notas','PUT',{id:n.id,titulo:$('#ft').value,tema:$('#fm').value,tipo:$('#fp').value,tags:$('#fg').value,corpo:$('#fc').value});location.hash='#/nota/'+r.id}catch(x){msg(x.message)}};
  $('#sv').onclick=salvar;
  $('main').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();salvar()}};
}

async function rota(){
  const[,r,a,b]=location.hash.split('/');
  $('main').onkeydown=null;
  try{
    meta=await api('/api/meta');
    if(r==='nota')await ver(a,b);
    else if(r==='nova')editor(null);
    else if(r==='editar')editor(await api(`/api/notas/${a}/${b}`));
    else if(r==='notas')await lista();
    else await inicio();
  }catch(e){$('main').innerHTML=`<p class="erro">${esc(e.message)}</p><a href="#/">Voltar ao início</a>`}
  window.scrollTo(0,0);
}
addEventListener('hashchange',rota);rota();
</script>
</body>
</html>
